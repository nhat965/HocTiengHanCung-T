services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: korean_learning
      POSTGRES_USER: korean_learning
      POSTGRES_PASSWORD: korean_learning_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U korean_learning -d korean_learning"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
