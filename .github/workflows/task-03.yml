name: Task 03 private knowledge engine

on:
  pull_request:
    branches: [master]
  push:
    branches: [codex/task-03-structured-knowledge]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: korean_learning
          POSTGRES_USER: korean_learning
          POSTGRES_PASSWORD: korean_learning_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U korean_learning -d korean_learning"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://korean_learning:korean_learning_dev@localhost:5432/korean_learning
      TEST_DATABASE_URL: postgresql+psycopg://korean_learning:korean_learning_dev@localhost:5432/korean_learning
      PRIVATE_API_TOKEN: ci-test-token
      PRIVATE_OWNER_ID: ci-test-owner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install Korean fixture font
        run: |
          timeout 180s sudo apt-get update --quiet
          sudo apt-get install --yes --no-install-recommends fonts-unfonts-core
      - name: Install API dependencies and audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/api/requirements.txt pip-audit
          pip-audit -r apps/api/requirements.txt
      - name: Verify PostgreSQL migrations
        working-directory: apps/api
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
      - name: Run API and PostgreSQL integration tests
        working-directory: apps/api
        run: python -m pytest tests -q

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build frontend
        run: npm run build:web
